name: unpack-release-zip
on:
  push:
    paths: ["kabocr-v*.zip", ".github/workflows/unpack.yml"]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the uploaded archive into the repository
        run: |
          set -e
          Z=$(ls kabocr-v*.zip 2>/dev/null | head -1 || true)
          if [ -z "$Z" ]; then echo "no archive to unpack"; exit 0; fi
          unzip -q "$Z" -d /tmp/unz
          SRC=$(find /tmp/unz -mindepth 1 -maxdepth 1 -type d | head -1)
          cp -a "$SRC"/. .
          git rm -q "$Z"
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack $Z"
          git push
